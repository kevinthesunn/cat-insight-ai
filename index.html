<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteMemory — Machine Memory Layer for CAT Assets & Job Sites</title>
  <script>
    // Dark by default. Runs before first paint so there is no light flash.
    (function () {
      try {
        var t = localStorage.getItem("site-memory-theme");
        // Explicit class in both branches — an ambiguous no-class state would
        // desync the ThemeToggle's initial state from the DOM.
        if (t === "light") document.documentElement.classList.add("light");
        else document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
